<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register as Patient | BystanderCare</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
    <style>
        .register-container {
            max-width: 540px;
            margin: 60px auto;
            background: white;
            padding: 48px 40px;
            border-radius: 24px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.06);
        }
        .register-container h2 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .register-container p.sub {
            color: var(--text-light);
            margin-bottom: 32px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 6px;
            color: var(--text-dark);
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e8edf2;
            border-radius: 12px;
            font-size: 1rem;
            transition: var(--transition);
            font-family: inherit;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(10,107,138,0.1);
        }
        .form-group .input-hint {
            font-size: 0.8rem;
            color: var(--text-light);
            margin-top: 4px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .form-group .otp-row {
            display: flex;
            gap: 12px;
        }
        .form-group .otp-row input {
            flex: 1;
        }
        .btn-otp {
            background: var(--primary-light);
            color: var(--primary);
            border: none;
            padding: 0 20px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-otp:hover {
            background: #c0dde8;
        }
        .btn-submit {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-submit:hover {
            background: var(--primary-dark);
        }
        .register-footer {
            text-align: center;
            margin-top: 24px;
            color: var(--text-light);
        }
        .register-footer a {
            color: var(--primary);
            font-weight: 600;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-light);
            margin-bottom: 20px;
            font-weight: 500;
        }
        .back-link:hover {
            color: var(--primary);
        }
        .required-star {
            color: var(--accent);
        }
        @media (max-width: 600px) {
            .register-container {
                padding: 30px 20px;
                margin: 30px 16px;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <a href="../index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Home</a>
        <h2><i class="fas fa-user-plus" style="color:var(--primary);margin-right:10px;"></i>Patient Registration</h2>
        <p class="sub">Get the care you need. Register to book verified bystanders.</p>

        <form id="patientRegisterForm">
            <div class="form-row">
                <div class="form-group">
                    <label>Full Name <span class="required-star">*</span></label>
                    <input type="text" placeholder="John Doe" required />
                </div>
                <div class="form-group">
                    <label>Date of Birth <span class="required-star">*</span></label>
                    <input type="date" required />
                </div>
            </div>

            <div class="form-group">
                <label>Email Address <span class="required-star">*</span></label>
                <input type="email" placeholder="you@example.com" required />
            </div>

            <div class="form-group">
                <label>Mobile Number <span class="required-star">*</span></label>
                <div class="otp-row">
                    <input type="tel" placeholder="9876543210" required />
                    <button type="button" class="btn-otp">Send OTP</button>
                </div>
                <div class="input-hint">We'll send a verification code to this number</div>
            </div>

            <div class="form-group">
                <label>OTP <span class="required-star">*</span></label>
                <input type="text" placeholder="Enter 6-digit OTP" required />
            </div>

            <div class="form-group">
                <label>Residential Address <span class="required-star">*</span></label>
                <textarea rows="2" placeholder="Flat/House, Street, Area" required></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>City <span class="required-star">*</span></label>
                    <input type="text" placeholder="Kochi" required />
                </div>
                <div class="form-group">
                    <label>State <span class="required-star">*</span></label>
                    <input type="text" placeholder="Kerala" required />
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Pincode <span class="required-star">*</span></label>
                    <input type="text" placeholder="682001" required />
                </div>
                <div class="form-group">
                    <label>Emergency Contact</label>
                    <input type="tel" placeholder="Family/relative number" />
                </div>
            </div>

            <div class="form-group">
                <label>Preferred Service Type</label>
                <select>
                    <option>Hospital Stay Support</option>
                    <option>Home Care</option>
                    <option>Emergency Support</option>
                    <option>Elderly Care</option>
                </select>
            </div>

            <div class="form-group">
                <label>Medical Conditions (Optional)</label>
                <textarea rows="2" placeholder="Any specific care requirements..."></textarea>
            </div>

            <div class="form-group" style="display:flex;gap:12px;align-items:flex-start;margin-top:24px;">
                <input type="checkbox" id="consent" required style="width:20px;margin-top:4px;" />
                <label for="consent" style="font-weight:400;font-size:0.9rem;">
                    I agree to the <a href="#" style="color:var(--primary);">Terms & Conditions</a> and 
                    <a href="#" style="color:var(--primary);">Privacy Policy</a>. I understand that my data will be used for service bookings.
                    <span class="required-star">*</span>
                </label>
            </div>

            <button type="submit" class="btn-submit">
                <i class="fas fa-check-circle"></i> Register & Continue
            </button>

            <div class="register-footer">
                Already registered? <a href="login.html">Login here</a>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('patientRegisterForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('✅ Registration submitted! Your account will be verified shortly.');
        });
    </script>
</body>
</html>
